# Publishes gym-coach/ to GitHub Pages (free for public repos) so it can be installed on
# iPhone via Safari → Share → "Add to Home Screen". One-time setup: repo Settings → Pages →
# Source: "GitHub Actions".
name: GymCoach web app (GitHub Pages)

on:
  push:
    branches: [main, claude/gym-trading-ai-app-pemten]
    paths: ['gym-coach/**', '.github/workflows/gym-coach-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gym-coach-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test gym-coach/tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r gym-coach/index.html gym-coach/manifest.webmanifest gym-coach/sw.js gym-coach/css gym-coach/js gym-coach/icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
